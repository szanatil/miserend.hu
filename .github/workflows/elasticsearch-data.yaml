name: 🐳 Weekly Build & publish elasticsearch data

on:
  schedule:
    # Every Monday at 02:00 UTC (04:00 CET/CEST)
    - cron: '0 2 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag to current date
        id: tag
        run: |
          TAG=$(date +%Y.%m.%d)
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Building image with tag: $TAG"

      - name: Export elasticsearch data from production
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          
          # Debug: Validate secrets are set
          echo "Checking secret configuration..."
          if [ -z "$DEPLOY_KEY" ]; then
            echo "❌ ERROR: DEPLOY_KEY secret is empty or not set"
            exit 1
          fi
          if [ -z "$DEPLOY_HOST" ]; then
            echo "❌ ERROR: DEPLOY_HOST secret is empty or not set"
            exit 1
          fi
          if [ -z "$DEPLOY_USER" ]; then
            echo "❌ ERROR: DEPLOY_USER secret is empty or not set"
            exit 1
          fi
          echo "✓ All secrets are configured"
          
          # Create key file with proper handling
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Debug: Validate key file
          echo "Validating deploy key file..."
          if [ ! -s ~/.ssh/deploy_key ]; then
            echo "❌ ERROR: deploy_key file is empty"
            exit 1
          fi
          
          KEY_SIZE=$(wc -c < ~/.ssh/deploy_key)
          echo "✓ Key file created (${KEY_SIZE} bytes)"
          
          # Validate key format
          if ! head -1 ~/.ssh/deploy_key | grep -q "BEGIN.*PRIVATE KEY"; then
            echo "❌ ERROR: Key file doesn't start with 'BEGIN PRIVATE KEY' marker"
            head -1 ~/.ssh/deploy_key
            exit 1
          fi
          echo "✓ Key file format is valid"
          
          # Add host key with debug output
          echo "Adding host key for $DEPLOY_HOST..."
          if ! ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
            echo "❌ ERROR: ssh-keyscan failed"
            exit 1
          fi
          echo "✓ Host key added to known_hosts"
          
          # Test SSH connection with verbose output
          echo "Testing SSH connection to $DEPLOY_USER@$DEPLOY_HOST..."
          SSH_LOG=$(ssh -vvv -i ~/.ssh/deploy_key -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" "echo 'SSH connection successful'" 2>&1)
          SSH_EXIT=$?
          
          if [ $SSH_EXIT -ne 0 ]; then
            echo "❌ ERROR: SSH authentication failed (exit code: $SSH_EXIT)"
            echo "=== SSH Debug Output ==="
            echo "$SSH_LOG" | grep -E "(authentication|Offering|Authentications|Permission|publickey|key|authorized)" || echo "$SSH_LOG"
            echo "========================"
            exit 1
          fi
          echo "✓ SSH connection successful"
          
          # Copy elasticsearch data directory from production server and compress
          echo "Exporting Elasticsearch data..."
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker exec elasticsearch tar czf - -C /usr/share/elasticsearch/data ." > elasticsearch_data.tar.gz
          
          # Verify file exists and has content
          if [ -f elasticsearch_data.tar.gz ] && [ -s elasticsearch_data.tar.gz ]; then
            echo "✓ Data export successful ($(du -h elasticsearch_data.tar.gz | cut -f1))"
          else
            echo "✗ Error: Data export failed or is empty"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/elasticsearch/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/miserend-elasticsearch-data:${{ steps.tag.outputs.TAG }}
            ghcr.io/${{ github.repository_owner }}/miserend-elasticsearch-data:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: elasticsearch-data-${{ steps.tag.outputs.TAG }}
          name: Elasticsearch Data ${{ steps.tag.outputs.TAG }}
          body: |
            ## Weekly Elasticsearch Data Snapshot
            
            **Build Date:** ${{ steps.tag.outputs.TAG }}
            **Image:** `ghcr.io/${{ github.repository_owner }}/miserend-elasticsearch-data:${{ steps.tag.outputs.TAG }}`
            
            This image is automatically built from the production Elasticsearch instance every Monday at 02:00 UTC.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
